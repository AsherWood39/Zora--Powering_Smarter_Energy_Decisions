services:
  - type: web
    name: zora-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false        # Set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
